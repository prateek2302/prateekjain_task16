<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Records - Map & Filter Exercise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="navbar">
      <div class="user-greeting">Hi, Username</div>
      <button class="login-btn">Login</button>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by student name..." 
          autocomplete="off"
        />
      </div>
      <button id="searchBtn" class="search-action-btn">Search</button>
    </section>

    <!-- Query status / Feedback text -->
    <h3 id="searchTitle" class="section-title">All Students</h3>

    <!-- Cards Grid -->
    <main id="studentCardsContainer" class="cards-grid"></main>
  </div>

  <script src="script.js"></script>
</body>
</html>
